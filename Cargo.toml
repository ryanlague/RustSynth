[package]
name = "rust_synth"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
